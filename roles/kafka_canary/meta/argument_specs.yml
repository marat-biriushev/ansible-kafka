---
# Generated from defaults/main.yml; keep the two in sync.
argument_specs:
  main:
    short_description: Strimzi canary in Docker (compose)
    options:
      kafka_canary_enabled:
        description: Deploy the canary.
        type: bool
      kafka_canary_image:
        description: Image reference; quay.io only, see the role README.
        type: str
      kafka_canary_project_dir:
        description: Compose project directory.
        type: str
      kafka_canary_port:
        description: Published port (container 8080).
        type: int
      kafka_canary_bootstrap_servers:
        description: Broker host:port list (CLIENT listener).
        type: list
        elements: raw
      kafka_canary_kafka_user:
        description: SCRAM account.
        type: str
      kafka_canary_kafka_password:
        description: Its password (vault).
        type: str
        no_log: true
      kafka_canary_ca_file:
        description: CA file on the host, mounted read-only.
        type: str
      kafka_canary_topic:
        description: Canary topic.
        type: str
      kafka_canary_group_id:
        description: Canary consumer group.
        type: str
      kafka_canary_expected_cluster_size:
        description: Number of brokers the canary waits for.
        type: raw
      kafka_canary_env_extra:
        description: Extra environment variables.
        type: dict
      kafka_canary_healthcheck:
        description: Docker healthcheck test.
        type: list
        elements: raw
