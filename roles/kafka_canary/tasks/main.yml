---
- name: Check the canary settings
  ansible.builtin.assert:
    that:
      - kafka_canary_bootstrap_servers | length > 0
      - kafka_canary_kafka_password | length >= 12
      - kafka_canary_kafka_password is not search('[\s"$#\\]')
    fail_msg: >-
      kafka_canary_bootstrap_servers must be set and kafka_canary_kafka_password must come from
      the vault (12+ characters, no spaces, quotes, $, # or backslashes).
    quiet: true
  no_log: true
  when: kafka_canary_enabled

- name: Create the project directory
  ansible.builtin.file:
    path: "{{ kafka_canary_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: kafka_canary_enabled

- name: Deploy the secrets
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ kafka_canary_project_dir }}/secrets.env"
    owner: root
    group: root
    mode: "0600"
  register: kafka_canary_secrets
  no_log: true
  when: kafka_canary_enabled

- name: Deploy compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ kafka_canary_project_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  when: kafka_canary_enabled

- name: Start the canary
  community.docker.docker_compose_v2:
    project_src: "{{ kafka_canary_project_dir }}"
    state: present
    pull: missing
    # Compose does not always notice a changed env_file
    recreate: "{{ 'always' if kafka_canary_secrets is changed else 'auto' }}"
    wait: true
    wait_timeout: 300
  when: kafka_canary_enabled
