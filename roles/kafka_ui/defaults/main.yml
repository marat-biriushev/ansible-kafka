---
kafka_ui_image: "{{ container_registry | default('docker.io') }}/kafbat/kafka-ui:v1.5.0"
kafka_ui_project_dir: /opt/kafka-ui
kafka_ui_port: 8080
kafka_ui_cluster_name: "{{ kafka_env | default('kafka') }}"

# Kafka connection: CLIENT listener, SCRAM-SHA-512 over TLS. The account has
# read-only ACLs; the UI is also switched to read-only mode.
kafka_ui_bootstrap_servers: "{{ kafka_bootstrap_servers }}"
kafka_ui_kafka_user: kafka-ui
kafka_ui_kafka_password: ""
kafka_ui_ca_file: /etc/kafka-services/ca.pem
kafka_ui_readonly: true
kafka_ui_schema_registry_url: ""

# Web login: LOGIN_FORM | OAUTH2 | LDAP. LOGIN_FORM uses the two variables
# below; for OAUTH2 / LDAP put the Spring settings into kafka_ui_auth_env
# (kept in the 0600 env file, so secrets may go there).
kafka_ui_auth_type: LOGIN_FORM
kafka_ui_login_user: admin
kafka_ui_login_password: ""
kafka_ui_auth_env: {}

kafka_ui_healthcheck: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
kafka_ui_env_extra: {}
