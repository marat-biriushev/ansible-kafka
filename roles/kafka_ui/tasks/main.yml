---
- name: Check the Kafka UI settings
  ansible.builtin.assert:
    that:
      - kafka_ui_bootstrap_servers | length > 0
      - kafka_ui_auth_type in ['LOGIN_FORM', 'OAUTH2', 'LDAP']
      - kafka_ui_kafka_password | length >= 12
      - kafka_ui_kafka_password is not search('[\s"$#\\]')
      - kafka_ui_auth_type != 'LOGIN_FORM' or kafka_ui_login_password | length >= 12
      - kafka_ui_login_password is not search('[\s$#]')
    fail_msg: >-
      kafka_ui_bootstrap_servers must be set; kafka_ui_auth_type is LOGIN_FORM, OAUTH2 or LDAP;
      kafka_ui_kafka_password (and kafka_ui_login_password for LOGIN_FORM) come from the vault,
      12+ characters, no spaces, quotes, $, # or backslashes.
    quiet: true
  no_log: true

- name: Create the project directory
  ansible.builtin.file:
    path: "{{ kafka_ui_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy the secrets
  ansible.builtin.template:
    src: secrets.env.j2
    dest: "{{ kafka_ui_project_dir }}/secrets.env"
    owner: root
    group: root
    mode: "0600"
  register: kafka_ui_secrets
  no_log: true

- name: Deploy compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ kafka_ui_project_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start Kafka UI
  # Pulls a missing image, (re)creates the container when compose.yml or the
  # env_file changed, and waits for the healthcheck. The output lists what
  # compose did; "Running"/"Healthy" alone means nothing changed.
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '--ansi', 'never', '--project-directory', kafka_ui_project_dir,
          'up', '--detach', '--wait', '--wait-timeout', '300']
         + (['--force-recreate'] if kafka_ui_secrets is changed else []) }}
  register: kafka_ui_up
  changed_when: (kafka_ui_up.stdout ~ kafka_ui_up.stderr) is search('(Created|Started|Pulled)')
