---
- name: Read the artifacts manifest
  ansible.builtin.set_fact:
    node_exporter_manifest_entry: >-
      {{ (lookup('ansible.builtin.file', node_exporter_artifacts_manifest) | from_yaml).artifacts
         | selectattr('file', 'equalto', node_exporter_file) | first | default({}) }}
  run_once: true

- name: Look for the node_exporter tarball in artifacts/
  ansible.builtin.stat:
    path: "{{ node_exporter_artifacts_dir }}/{{ node_exporter_file }}"
    checksum_algorithm: sha256
  register: node_exporter_tarball_stat
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail if the tarball is missing, corrupt or not pinned
  ansible.builtin.assert:
    that:
      - node_exporter_manifest_entry.sha256 | default('') | length == 64
      - node_exporter_tarball_stat.stat.exists
      - node_exporter_tarball_stat.stat.checksum == node_exporter_manifest_entry.sha256 | lower
    fail_msg: >-
      Put {{ node_exporter_file }} in artifacts/ (pinned with a sha256 in artifacts.yml),
      see README "Offline artifacts".
    quiet: true
  run_once: true

- name: Create the node_exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /sbin/nologin
    home: /nonexistent
    create_home: false

- name: Unpack node_exporter {{ node_exporter_version }}
  ansible.builtin.unarchive:
    src: "{{ node_exporter_artifacts_dir }}/{{ node_exporter_file }}"
    dest: "{{ node_exporter_install_root }}"
    remote_src: false
    owner: root
    group: root
    creates: "{{ node_exporter_install_dir }}/node_exporter"
  notify: Restart node_exporter

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy node_exporter.service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
