---
repos:
  - repo: local
    hooks:
      - id: check-offline
        name: roles do not reach the internet
        entry: scripts/check-offline.sh
        language: system
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: yamllint -s
        language: system
        types: [yaml]
      - id: ansible-lint
        name: ansible-lint
        entry: ansible-lint
        language: system
        pass_filenames: false
