# scrape_configs entries as the monitoring team runs them (TEST and PROD).
# kafka-alerts.yml selects on these job names (int-res-<env>-...) and uses
# the cluster and node labels. All exporters serve /metrics over HTTP.
---
- job_name: int-res-prod-kafka-jmx
  scrape_interval: 15s
  metrics_path: /metrics
  static_configs:
    - targets: [172.31.60.111:7071]
      labels: {cluster: int-res-prod-cluster, node: int-res-prod-kafka01}
    - targets: [172.31.60.112:7071]
      labels: {cluster: int-res-prod-cluster, node: int-res-prod-kafka02}
    - targets: [172.31.60.113:7071]
      labels: {cluster: int-res-prod-cluster, node: int-res-prod-kafka03}

- job_name: int-res-prod-kafka-node
  scrape_interval: 15s
  metrics_path: /metrics
  static_configs:
    - targets: [172.31.60.111:9100]
      labels: {cluster: int-res-prod-cluster, node: int-res-prod-kafka01}
    - targets: [172.31.60.112:9100]
      labels: {cluster: int-res-prod-cluster, node: int-res-prod-kafka02}
    - targets: [172.31.60.113:9100]
      labels: {cluster: int-res-prod-cluster, node: int-res-prod-kafka03}
    - targets: [172.31.60.114:9100]
      labels: {cluster: int-res-prod-cluster, node: int-res-prod-kafkasvc01}

- job_name: int-res-prod-kafka-lag
