---
# Offline artifacts. scripts/fetch-artifacts.sh downloads every entry on a
# machine with internet access and checks it against the pinned checksum;
# the roles check the same checksum on the control node before using a file.
# Bump a version here and in the role defaults together.
artifacts:
  - name: kafka
    version: "4.3.1"
    file: kafka_2.13-4.3.1.tgz
    url: https://archive.apache.org/dist/kafka/4.3.1/kafka_2.13-4.3.1.tgz
    sha512: c7d7b2318cb51aa0c61d3246a51c349210073c5c9b754947ef965a439f2f939e8600f204e134a75ac31faf3829c9370960ef7c6a9886c8a1dbf0339a21f4c54c
    used_on: kafka01-03

  - name: jmx_prometheus_javaagent
    version: "1.7.0"
    file: jmx_prometheus_javaagent-1.7.0.jar
    url: https://github.com/prometheus/jmx_exporter/releases/download/1.7.0/jmx_prometheus_javaagent-1.7.0.jar
    sha256: 0ad843261c567d1924a017d542e14c40f2afff523d940c25ee000742fde4b3a9
    used_on: kafka01-03, kafkasvc01 (Schema Registry)

  - name: node_exporter
    version: "1.12.1"
    file: node_exporter-1.12.1.linux-amd64.tar.gz
    url: https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz
    sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
    used_on: all hosts

# Kafka Connect plugins, downloaded into artifacts/connect-plugins/ and
# installed by the kafka_connect role when listed in kafka_connect_plugins.
# tar.gz preferred (zip needs unzip on the services VM). Example:
#  - name: debezium-connector-postgres
#    version: "<version>"
#    file: debezium-connector-postgres-<version>-plugin.tar.gz
#    url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/<version>/debezium-connector-postgres-<version>-plugin.tar.gz
#    sha256: <sha256 of the file>
connect_plugins: []

# Ansible collections from requirements.yml, fetched with
# "ansible-galaxy collection download" into artifacts/collections/.
collections_requirements: requirements.yml

# Optional: OpenJDK 21 headless with dependencies, only when the internal dnf
# repository does not carry it. Fetched with "dnf download --resolve" on a
# RHEL 10 / AlmaLinux 10 machine into artifacts/rpms/, installed by hand.
java_rpms:
  enabled: false
  packages:
    - java-21-openjdk-headless
