---
# Quorum 3/3, topic with RF=3, an acks=all producer authenticated with SCRAM
# writes and a consumer reads the same records back.
- name: Verify the cluster
  hosts: kafka[0]
  become: true
  gather_facts: false
  vars:
    client_config: /tmp/molecule-client.properties
    bootstrap: "{{ groups['kafka'] | map('regex_replace', '$', ':9092') | join(',') }}"
  tasks:
    - name: Describe the quorum
      ansible.builtin.command: >-
        /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server {{ inventory_hostname }}:9091
        --command-config /etc/kafka/admin.properties describe --replication
      register: quorum
      changed_when: false

    - name: Check that there are 3 voters
      ansible.builtin.assert:
        that: quorum.stdout | regex_findall('(?m)\s(Leader|Follower)\s*$') | length == 3
        fail_msg: "{{ quorum.stdout }}"

    - name: Describe the test topic
      ansible.builtin.command: >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ inventory_hostname }}:9091
        --command-config /etc/kafka/admin.properties --describe --topic molecule-test
      register: topic
      changed_when: false

    - name: Check RF=3
      ansible.builtin.assert:
        that: "'ReplicationFactor: 3' in topic.stdout"
        fail_msg: "{{ topic.stdout }}"

    - name: Write the SCRAM client config
      ansible.builtin.copy:
        dest: "{{ client_config }}"
        mode: "0600"
        content: |
          security.protocol=SASL_SSL
          sasl.mechanism=SCRAM-SHA-512
          sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="tester" password="MoleculeTester123";
          ssl.truststore.type=PEM
          ssl.truststore.location=/etc/kafka/tls/ca.pem
          acks=all
          group.id=molecule-verify

    - name: Produce 100 records with acks=all
      ansible.builtin.shell: >-
        set -o pipefail;
        seq 1 100 | /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server {{ bootstrap }}
        --command-config {{ client_config }} --topic molecule-test
      args:
        executable: /bin/bash
      changed_when: false

    - name: Consume them back
      ansible.builtin.command: >-
        /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server {{ bootstrap }}
        --command-config {{ client_config }} --topic molecule-test --from-beginning
        --max-messages 100 --timeout-ms 60000
      register: consumed
      changed_when: false

    - name: Check that all 100 records came back
      ansible.builtin.assert:
        that: consumed.stdout_lines | map('int') | sort == range(1, 101) | list
        fail_msg: "consumed {{ consumed.stdout_lines | length }} records"
